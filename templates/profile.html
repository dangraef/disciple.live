{% extends 'base.html' %}{% block content %}<section class="card narrow"><p class="eyebrow">YOUR PROFILE</p><h1>Help people know you.</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{ user.name }}" required maxlength="100"></label><label>Introduction<textarea name="bio" rows="5" maxlength="2000">{{ user.bio }}</textarea></label><label>Time zone<input name="timezone" value="{{ user.timezone }}" list="timezones" required></label><datalist id="timezones"><option value="America/Los_Angeles"><option value="America/Denver"><option value="America/Chicago"><option value="America/New_York"><option value="Europe/London"><option value="UTC"></datalist><p class="small">For example: America/Los_Angeles. All meeting times use this setting.</p><details><summary>Change password</summary><label>Current password<input type="password" name="current_password" autocomplete="current-password"></label><label>New password<input type="password" name="new_password" minlength="12" maxlength="128" autocomplete="new-password"></label></details><button>Save profile</button></form></section>{% endblock %}
