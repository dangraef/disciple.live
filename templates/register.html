{% extends 'base.html' %}{% block content %}<section class="card narrow"><p class="eyebrow">BEGIN HERE</p><h1>A next step in following Jesus.</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" autocomplete="name" required maxlength="100"></label><label>Email<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Password <span class="small">At least 12 characters</span><input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>How would you like to begin?<select name="role"><option value="disciplee">Find a discipler</option><option value="disciplier" {% if request.args.get('role') == 'disciplier' %}selected{% endif %}>Become a discipler</option></select></label><label>Introduce yourself<textarea name="bio" rows="4" maxlength="2000" placeholder="What are you hoping to learn or help someone grow in?"></textarea></label><p class="small">Discipler introductions are visible to signed-in members. Keep personal contact information out of your bio.</p><button>Create account</button></form><p>Already a member? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
